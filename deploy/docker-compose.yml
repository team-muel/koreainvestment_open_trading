# GCP / Oracle Cloud — 4 worker Docker Compose
# 사용법: docker compose up -d

services:
  # ── 1. 메인 트레이딩 엔진 ──────────────────────────────
  trading-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kis-trading-worker
    restart: unless-stopped
    command: python -m strategy_builder.workers.trading_worker
    env_file: .env
    volumes:
      - trading_data:/app/data
      - ./logs:/app/logs
      - /opt/kis-config:/home/kisbot/KIS/config
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('/home/kisbot/KIS/config/kis_devlp.yaml') or exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kis-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── 2. FastAPI 백엔드 서버 ──────────────────────────────
  api-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kis-api-server
    restart: unless-stopped
    command: uvicorn strategy_builder.backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - trading_data:/app/data
      - /opt/kis-config:/home/kisbot/KIS/config
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - kis-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── 3. Notion Sync Worker ──────────────────────────────
  notion-sync-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kis-notion-sync
    restart: unless-stopped
    command: python -m strategy_builder.workers.notion_sync_worker
    env_file: .env
    networks:
      - kis-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 4. Alert Worker (Telegram) ──────────────────────────
  alert-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kis-alert-worker
    restart: unless-stopped
    command: python -m strategy_builder.workers.alert_worker
    env_file: .env
    networks:
      - kis-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 5. Daily Report Worker ──────────────────────────────
  daily-report-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kis-daily-report
    restart: unless-stopped
    command: python -m strategy_builder.workers.daily_report_worker
    env_file: .env
    volumes:
      - /opt/kis-config:/home/kisbot/KIS/config
    networks:
      - kis-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kis-net:
    driver: bridge

volumes:
  trading_data:
    driver: local
