services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    image: kis-ict-python:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PYTHONPATH: /app:/app/strategy_builder
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DAILY_REPORTS_DB_ID: ${NOTION_DAILY_REPORTS_DB_ID:-}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ${KIS_CONFIG_DIR:?Set KIS_CONFIG_DIR in .env}:/root/KIS/config:rw
      - ./strategy_builder/data:/app/strategy_builder/data:rw
      - ./logs:/app/logs:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: strategy_builder/frontend/Dockerfile
    image: kis-ict-frontend:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  ict-job:
    image: kis-ict-python:local
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    profiles: ["jobs"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PYTHONPATH: /app:/app/strategy_builder
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DAILY_REPORTS_DB_ID: ${NOTION_DAILY_REPORTS_DB_ID:-}
      GOOGLE_OAUTH_CLIENT_JSON: ${GOOGLE_OAUTH_CLIENT_JSON:-}
      GOOGLE_TOKEN_JSON: ${GOOGLE_TOKEN_JSON:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
    volumes:
      - ${KIS_CONFIG_DIR:?Set KIS_CONFIG_DIR in .env}:/root/KIS/config:rw
      - ./strategy_builder/data:/app/strategy_builder/data:rw
      - ./logs:/app/logs:rw
      - ${GOOGLE_OAUTH_CLIENT_JSON:-/dev/null}:${GOOGLE_OAUTH_CLIENT_JSON:-/dev/null}:ro
      - ${GOOGLE_TOKEN_JSON:-/dev/null}:${GOOGLE_TOKEN_JSON:-/dev/null}:rw
    command: ["python", "scripts/ict_daily_workflow.py", "--help"]
